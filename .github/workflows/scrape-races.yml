name: Horses Pipeline

# Runs scripts/run_pipeline.sh — the same script the Mac's launchd agent runs —
# so both hosts share one set of safeguards (sync before write, origin-wins
# redo on a lost push race, create-if-absent start-of-day archive).
#
# There is deliberately no `schedule:` here: GitHub's cron queue drops and
# delays runs (community discussion 156282). An EventBridge Scheduler in AWS
# (infra/pipeline-scheduler.yaml) calls workflow_dispatch on main every 20
# minutes, 07:00–20:59 UTC; with no inputs the script decides what's due.
#
# The file keeps its old name (scrape-races.yml) because the AWS trigger
# dispatches it by file name.
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'auto = whatever is due now; scrape / results = force that job'
        type: choice
        options: [auto, scrape, results]
        default: auto
      date:
        description: 'Date for a forced job, YYYY-MM-DD (blank = today for scrape, yesterday for results)'
        required: false
        default: ''

# One group for every run, whatever it does, so two runs never write or push
# at once. A run that's already going finishes; GitHub keeps at most one
# pending run, which is all a 20-minute tick needs.
concurrency:
  group: horses-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The data clone is always main, whichever ref was dispatched: the script
      # commits and pushes to main.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      # Pre-merge testing: dispatching with ref=<branch> runs that branch's
      # run_pipeline.sh against main (the data scripts it calls come from main).
      - name: Take run_pipeline.sh from the dispatched ref
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = refs/heads/main ]; then
            cp scripts/run_pipeline.sh "$RUNNER_TEMP/run_pipeline.sh"
          else
            git fetch -q --depth=1 origin "$REF"
            git show FETCH_HEAD:scripts/run_pipeline.sh > "$RUNNER_TEMP/run_pipeline.sh"
            echo "::notice::Using run_pipeline.sh from $REF"
          fi

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # match the Mac

      - name: Run pipeline
        env:
          JOB: ${{ inputs.job }}
          DATE: ${{ inputs.date }}
          PIPELINE_REPO_DIR: ${{ github.workspace }}
          PIPELINE_STATE_DIR: ${{ runner.temp }}/pipeline-state
          PIPELINE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARGS=()
          if [ -n "$JOB" ] && [ "$JOB" != auto ]; then
            ARGS=("$JOB")
            [ -n "$DATE" ] && ARGS+=("$DATE")
          fi
          bash "$RUNNER_TEMP/run_pipeline.sh" ${ARGS[@]+"${ARGS[@]}"}
