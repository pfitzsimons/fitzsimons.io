name: Scrape Races

# Manual fallback only. The schedule moved off GitHub Actions — its cron queue
# dropped and delayed runs (community discussion 156282) — to
# scripts/run_pipeline.sh, driven by a launchd agent (see README "Automation").
# The first run of the day writes the frozen start-of-day accuracy record;
# later runs refresh the live races.json without touching it.
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Date override YYYY-MM-DD (leave blank for today)'
        required: false
        default: ''

# Never let two scrapes run at once — a queued run waits for the in-flight one
# to finish committing, so intraday merges can't race each other.
concurrency:
  group: scrape-races
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape today's races
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: |
          DATE_ARG=""
          if [ -n "$DATE_OVERRIDE" ]; then
            DATE_ARG="--date $DATE_OVERRIDE"
          fi
          python3 scripts/scrape_races.py $DATE_ARG --out "$GITHUB_WORKSPACE/horses"

      - name: Verify output
        run: |
          if [ ! -f horses/races.json ]; then
            echo "ERROR: horses/races.json not found"
            exit 1
          fi
          RACE_COUNT=$(python3 -c "import json; d=json.load(open('horses/races.json')); print(len(d.get('races',[])))")
          echo "Scraped $RACE_COUNT races"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Live file plus the start-of-day archive the first run writes.
          git add horses/races.json horses/history/ || true
          if git diff --staged --quiet; then
            echo "No content changes — nothing to commit"
          else
            git commit -m "🏇 Races $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
            # A concurrent run may have pushed between our checkout and now;
            # rebase on the latest before pushing so we never clobber it.
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push
          fi
